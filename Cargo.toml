[workspace]
resolver = "2"
members = [
    "crates/xaerominimap-json",
    "crates/xaerominimap-core",
    "crates/xaerominimap-settings",
    "crates/xaerominimap-controls",
    "crates/xaerominimap-network",
    "crates/xaerominimap-render",
    "crates/xaerominimap",
    "crates/xaerominimap-horizon",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kubiknubika/xaero-s-minimap-rust"

[profile.release]
opt-level = 3
lto = true
