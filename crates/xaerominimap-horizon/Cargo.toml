description = "Horizon (Minecraft 26.3 Rust Edition) adapter for the ported Xaero's Minimap data layer."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
xaerominimap-core = { path = "../xaerominimap-core" }
xaerominimap-controls = { path = "../xaerominimap-controls" }
xaerominimap-network = { path = "../xaerominimap-network" }
xaerominimap-render = { path = "../xaerominimap-render" }
